<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Host Routing...</title>
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Nexus Host">
    <meta name="description" content="Manage your listings on Nexus Host">
    <meta name="theme-color" content="#050508">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexus Host">
    <link rel="apple-touch-icon" href="nexushostlogo.png">

    <!-- Manifest & Icon -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="nexushostlogo.png">
    <style>
        body {
            background-color: #050508;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            margin: 0;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
    <script src="js/telemetry.js"></script>
</head>
<body>
    <div class="spinner"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            try {
                const hostData = JSON.parse(localStorage.getItem('nexus_host') || '{}');
                const type = hostData.host_type || 'fest'; // Default to fest for legacy accounts
                
                let target = 'fest-dashboard.html';
                if (type === 'property') target = 'home-dashboard.html';
                else if (type === 'gym') target = 'gym-dashboard.html';
                else if (type === 'restaurant') target = 'restaurant-dashboard.html';

                window.location.replace(target);
            } catch (e) {
                window.location.replace('host-signup-login.html');
            }
        });
    </script>
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW error', err));
            });
        }
    </script>
</body>
</html>
