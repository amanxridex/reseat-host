<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Host | Manage Gyms</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }

        :root {
            --bg-dark: #120822; /* Core dark mode */
            --sidebar-bg: #1a0f2e;
            --card-bg: #1f113a;
            --card-border: rgba(255, 255, 255, 0.05);
            --neon-pink: #ff2a6d;
            --neon-cyan: #05d9e8;
            --neon-lime: #01ffc3;
            --neon-purple: #b122e5;
            --text-main: #ffffff;
            --text-muted: #8b7d9e;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            min-height: 100vh;
        }

        /* ─── Sidebar ─── */
        .sidebar {
            width: 250px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .brand {
            padding: 0 24px 30px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex; align-items: center; gap: 12px;
            letter-spacing: 1px;
        }

        .brand-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }

        .nav-item {
            padding: 15px 24px; display: flex; align-items: center; gap: 15px;
            color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500;
            transition: all 0.2s; border-left: 3px solid transparent;
        }

        .nav-item:hover { color: var(--text-main); background: rgba(255,255,255,0.02); }
        .nav-item.active { color: var(--neon-pink); border-left-color: var(--neon-pink); background: rgba(255, 42, 109, 0.05); }
        .nav-item i { width: 20px; text-align: center; font-size: 1.1rem; }

        /* ─── Mobile Toggle ─── */
        .mobile-toggle {
            display: none; position: fixed; top: 20px; right: 20px;
            background: var(--card-bg); border: 1px solid var(--neon-pink); color: var(--neon-pink);
            width: 45px; height: 45px; border-radius: 12px; z-index: 1000; cursor: pointer; font-size: 1.2rem;
        }

        /* ─── Main Content ─── */
        .main-content { flex: 1; padding: 30px; height: 100vh; overflow-y: auto; scroll-behavior: smooth; }

        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; }
        .page-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-main); font-weight: 600; }
        .page-title span { color: var(--text-muted); }

        .btn-glow {
            background: var(--neon-cyan); color: #000; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer;
            box-shadow: 0 0 15px rgba(5, 217, 232, 0.4); text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(5, 217, 232, 0.6); transform: translateY(-2px); }

        /* Filters */
        .filters { display: flex; gap: 15px; margin-bottom: 30px; }
        .search-box {
            flex: 1; max-width: 300px; position: relative;
        }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input {
            width: 100%; background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 12px 15px 12px 40px; border-radius: 8px; color: white; outline: none; transition: 0.2s;
        }
        .search-box input:focus { border-color: var(--neon-pink); }
        
        .filter-select {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 0 15px; border-radius: 8px; color: white; outline: none; cursor: pointer;
        }

        /* Gym Grid */
        .gyms-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px;
        }
        
        .gym-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 12px; overflow: hidden; transition: all 0.3s;
            position: relative;
        }
        .gym-card:hover { border-color: var(--neon-purple); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .gym-img {
            width: 100%; height: 180px; object-fit: cover; background: #000;
        }
        .gym-status {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.7);
            padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1px; backdrop-filter: blur(5px);
        }
        .status-active { color: var(--neon-lime); border: 1px solid var(--neon-lime); }
        .status-pending { color: #ffb703; border: 1px solid #ffb703; }
        
        .gym-details { padding: 20px; }
        .gym-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 5px; color: #fff; }
        .gym-addr { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .gym-stats { display: flex; justify-content: space-between; border-top: 1px solid var(--card-border); padding-top: 15px; margin-bottom: 15px;}
        .stat-item { text-align: center; }
        .stat-val { font-size: 1.1rem; font-weight: 700; color: var(--neon-cyan); }
        .stat-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-item.revenue .stat-val { color: var(--neon-pink); }
        
        .gym-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-action {
            padding: 8px; border-radius: 6px; border: 1px solid var(--card-border);
            background: rgba(255,255,255,0.03); color: #fff; cursor: pointer; transition: 0.2s;
            font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-action:hover { background: rgba(255,255,255,0.1); }
        .btn-edit:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
        .btn-delete:hover { border-color: var(--neon-pink); color: var(--neon-pink); }

        /* Overlay loader */
        .loading { text-align: center; color: var(--text-muted); padding: 50px 0; grid-column: 1 / -1; }
        .loading i { font-size: 2rem; color: var(--neon-pink); margin-bottom: 10px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { position: fixed; top: 0; left: -250px; bottom: 0; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
            .sidebar.show { left: 0; }
            .mobile-toggle { display: flex; align-items: center; justify-content: center; }
            .main-content { padding-top: 80px; padding-left: 20px; padding-right: 20px; }
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- Mobile Toggle -->
    <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('show')">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-dumbbell"></i></div>
            Nexus Gym
        </div>
        
        <a href="gym-dashboard.html" class="nav-item">
            <i class="fas fa-chart-pie"></i> Dashboard
        </a>
        <a href="create-gym.html" class="nav-item">
            <i class="fas fa-plus-circle"></i> Add Gym
        </a>
        <a href="my-gyms.html" class="nav-item active">
            <i class="fas fa-dumbbell"></i> Manage Gyms
        </a>
        <a href="qr-scanner.html" class="nav-item">
            <i class="fas fa-qrcode"></i> QR Scanner
        </a>
        
        <div class="sidebar-bottom" style="margin-top: auto;">
            <a href="#" class="nav-item" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout System
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <div>
                <div class="page-title"><span>GYM PANEL / </span> MANAGE GYMS</div>
                <h2 style="font-size: 1.8rem; margin-top: 5px; font-weight: 700;">Your Gyms</h2>
            </div>
            <a href="create-gym.html" class="btn-glow">
                <i class="fas fa-plus"></i> New Gym
            </a>
        </div>

        <div class="filters">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by name or location...">
            </div>
            <select class="filter-select" id="statusFilter">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="pending">Pending</option>
            </select>
        </div>

        <div class="gyms-grid" id="gymsGrid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading your gyms...</p>
            </div>
        </div>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- App Logic -->
    <script src="js/config.js"></script>
    <script src="js/my-gyms.js"></script>
</body>
</html>
