<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Host | My Properties</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Nexus Host">
    <meta name="description" content="Manage your property portfolio on Nexus Host">
    <meta name="theme-color" content="#120822">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexus Host">
    <link rel="apple-touch-icon" href="nexushostlogo.png">

    <!-- Manifest & Icon -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="nexushostlogo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }

        :root {
            --bg-dark: #120822; /* Deep dark purple/black */
            --sidebar-bg: #1a0f2e;
            --card-bg: #1f113a;
            --card-border: rgba(255, 255, 255, 0.05);
            /* Neon colors */
            --neon-pink: #ff2a6d;
            --neon-cyan: #05d9e8;
            --neon-lime: #01ffc3;
            --neon-purple: #b122e5;
            --text-main: #ffffff;
            --text-muted: #8b7d9e;
        }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            display: flex; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── Sidebar ─── */
        .sidebar {
            width: 250px; background: var(--sidebar-bg); border-right: 1px solid var(--card-border);
            display: flex; flex-direction: column; padding: 20px 0; transition: transform 0.3s ease; z-index: 100;
        }
        .brand { padding: 0 24px 30px; font-size: 1.2rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 12px; letter-spacing: 1px; }
        .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-lime)); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .nav-item { padding: 15px 24px; display: flex; align-items: center; gap: 15px; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover { color: var(--text-main); background: rgba(255,255,255,0.02); }
        .nav-item.active { color: var(--neon-cyan); border-left-color: var(--neon-cyan); background: rgba(5, 217, 232, 0.05); }
        .nav-item i { width: 20px; text-align: center; font-size: 1.1rem; }
        .sidebar-bottom { margin-top: auto; }

        /* ─── Mobile Toggle ─── */
        .mobile-toggle {
            display: none; position: fixed; top: 20px; right: 20px; background: var(--card-bg);
            border: 1px solid var(--neon-cyan); color: var(--neon-cyan); width: 45px; height: 45px; border-radius: 12px; z-index: 1000; cursor: pointer; font-size: 1.2rem;
        }

        /* ─── Main Content ─── */
        .main-content {
            flex: 1; padding: 30px; height: 100vh; overflow-y: auto;
        }

        .header { margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end; }
        .page-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-main); font-weight: 600; }
        .page-title span { color: var(--text-muted); }

        .btn-glow {
            background: var(--neon-cyan); color: #000; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
            box-shadow: 0 0 15px rgba(5, 217, 232, 0.4); transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(5, 217, 232, 0.6); transform: translateY(-2px); }

        /* ─── Properties Grid ─── */
        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            padding: 60px 20px;
            background: var(--card-bg);
            border: 2px dashed rgba(5, 217, 232, 0.3);
            border-radius: 16px;
            text-align: center;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3rem;
            color: var(--neon-cyan);
            opacity: 0.5;
            margin-bottom: 20px;
        }
        .empty-state h3 {
            color: var(--text-main);
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .empty-state p { margin-bottom: 25px; font-size: 0.9rem; }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { position: fixed; top: 0; left: -250px; bottom: 0; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
            .sidebar.show { left: 0; }
            .mobile-toggle { display: flex; align-items: center; justify-content: center; }
            .main-content { padding-top: 80px; }
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
    <script src="js/telemetry.js"></script>
    <script src="js/config.js"></script>
</head>
<body>

    <!-- Mobile Toggle -->
    <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('show')">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-home"></i></div>
            Nexus Property
        </div>
        
        <a href="home-dashboard.html" class="nav-item">
            <i class="fas fa-chart-line"></i> Dashboard
        </a>
        <a href="add-property.html" class="nav-item">
            <i class="fas fa-plus-square"></i> Add Property
        </a>
        <a href="my-properties.html" class="nav-item active">
            <i class="fas fa-building"></i> My Properties
        </a>
        <a href="inquiries.html" class="nav-item">
            <i class="fas fa-envelope-open-text"></i> Inquiries
        </a>
        
        <div class="sidebar-bottom">
            <a href="javascript:void(0)" class="nav-item" onclick="nexusLogout()">
                <i class="fas fa-sign-out-alt"></i> Logout System
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <div class="page-title">
                <span>DASHBOARD / </span> MY PROPERTIES
            </div>
            <a href="add-property.html" class="btn-glow">
                <i class="fas fa-plus"></i> NEW LISTING
            </a>
        </div>

        <div class="properties-grid" id="propertiesList">
            <!-- Empty state shown by default until real data is fetched -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-building"></i>
                <h3>No Properties Listed</h3>
                <p>You haven't added any rental properties to the network yet.</p>
                <a href="add-property.html" class="btn-glow">Add First Property</a>
            </div>
            <div id="loadingState" style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--neon-cyan);">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem;"></i>
                <p style="margin-top: 15px;">Loading your properties...</p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', fetchProperties);

        async function fetchProperties() {
            try {
                const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                const API_BASE = isLocal ? 'http://localhost:3000/api' : 'https://nexus-host-backend.onrender.com/api';

                const res = await fetch(`${API_BASE}/properties/mine`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include'
                });

                const data = await res.json();
                document.getElementById('loadingState').style.display = 'none';

                if (!res.ok) throw new Error(data.error || 'Failed to load properties');

                const propertiesList = document.getElementById('propertiesList');
                
                if (data.data.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }

                // Render properties
                data.data.forEach(prop => {
                    const statusColor = prop.status === 'approved' ? 'var(--neon-lime)' : 
                                       prop.status === 'rejected' ? 'var(--neon-pink)' : '#ffb400';
                                       
                    const card = document.createElement('div');
                    card.style.cssText = `
                        background: var(--card-bg);
                        border: 1px solid var(--card-border);
                        border-radius: 12px;
                        overflow: hidden;
                        display: flex;
                        flex-direction: column;
                    `;
                    
                    const coverImg = prop.images && prop.images.length > 0 ? prop.images[0] : 'https://via.placeholder.com/400x250?text=No+Image';

                    card.innerHTML = `
                        <div style="height: 180px; width: 100%; position: relative;">
                            <img src="${coverImg}" style="width: 100%; height: 100%; object-fit: cover;">
                            <div style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; color: ${statusColor}; border: 1px solid ${statusColor}; text-transform: uppercase;">
                                ${prop.status}
                            </div>
                        </div>
                        <div style="padding: 20px; flex: 1; display: flex; flex-direction: column;">
                            <h3 style="font-size: 1.1rem; margin-bottom: 5px;">${prop.title}</h3>
                            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px;"><i class="fas fa-map-marker-alt"></i> ${prop.city}</p>
                            
                            <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9rem;">
                                <div><span style="color:var(--text-muted)">Type:</span> <br>${prop.property_type}</div>
                                <div><span style="color:var(--text-muted)">Rent:</span> <br>₹${prop.monthly_rent}</div>
                            </div>
                            
                            <hr style="border: 0; height: 1px; background: var(--card-border); margin-bottom: 15px;">
                            
                            <div style="display: flex; gap: 10px; margin-top: auto;">
                                <button onclick="alert('Edit coming soon')" style="flex: 1; padding: 8px; background: rgba(5,217,232,0.1); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); border-radius: 6px; cursor: pointer;"><i class="fas fa-edit"></i> Edit</button>
                                <button onclick="alert('Are you sure you want to delete?')" style="padding: 8px 12px; background: rgba(255,42,109,0.1); border: 1px solid var(--neon-pink); color: var(--neon-pink); border-radius: 6px; cursor: pointer;"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    propertiesList.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('loadingState').innerHTML = `<p style="color: var(--neon-pink)">Error loading properties: ${error.message}</p>`;
            }
        }

        function logout() {
            localStorage.removeItem('nexus_host');
            window.location.href = 'host-signup-login.html';
        }

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW error', err));
            });
        }
    </script>
    </script>
</body>
</html>
