<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Host Fests Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- We load ONLY the new theme to prevent standard styles from clashing -->
    <link rel="stylesheet" href="css/fest-theme.css">
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Nexus Host">
    <meta name="theme-color" content="#2b2533">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="nexushostlogo.png">
</head>
<body>

<div class="nft-layout">
    
    <!-- 1. LEFT SIDEBAR -->
    <aside class="nft-sidebar" id="sidebar">
        <div class="nft-logo">N<span style="color:var(--nft-text-muted)">X</span></div>
        <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        
        <nav class="nft-nav">
            <a href="host-dashboard.html" class="nft-nav-icon"><i class="fas fa-home"></i></a>
            <a href="#" class="nft-nav-icon active"><i class="fas fa-calendar-alt"></i></a>
            <a href="create-fest.html" class="nft-nav-icon"><i class="fas fa-plus"></i></a>
            <a href="analytics.html" class="nft-nav-icon"><i class="fas fa-chart-pie"></i></a>
            <a href="payouts.html" class="nft-nav-icon"><i class="fas fa-wallet"></i></a>
            <a href="settings.html" class="nft-nav-icon"><i class="fas fa-cog"></i></a>
        </nav>
        
        <div class="nft-user" onclick="logout()" style="cursor: pointer;" title="Logout">
            <img src="https://placehold.co/100x100/8b5cf6/ffffff?text=H" alt="Profile" id="profileImg">
        </div>
    </aside>

    <!-- 2. MIDDLE CONTENT -->
    <main class="nft-main">
        
        <!-- Header -->
        <header class="nft-header">
            <div class="nft-segmented">
                <div class="nft-segment active">Fests</div>
                <div class="nft-segment" onclick="window.location.href='analytics.html'">Analytics</div>
            </div>
            
            <div class="nft-header-actions">
                <div class="nft-search">
                    <i class="fas fa-search" style="color: var(--nft-text-muted)"></i>
                    <input type="text" placeholder="Search Fests, Tickets...">
                </div>
                <!-- ID attached here for JS hook -->
                <a href="create-fest.html" class="nft-add-btn" id="createFestCTA">
                    <i class="fas fa-plus-circle"></i> Add Fest
                </a>
                <button class="nft-nav-icon" style="background: var(--nft-surface); margin-left: 10px;" onclick="showNotifications()">
                    <i class="fas fa-bell"></i>
                </button>
            </div>
        </header>

        <!-- Verification Banner from original logic -->
        <div class="verification-banner" id="verificationBanner" style="display: none; background: rgba(255,0,0,0.1); padding: 15px; border-radius: 15px; color: #ff6b6b; font-size: 0.9rem;">
            Verification Pending. Host features limited.
        </div>

        <!-- Recent Fests (Overlapping Deck) -->
        <section>
            <div class="nft-section-title">Active Fests</div>
            
            <div class="nft-deck" id="liveFests">
                <!-- JS will inject dynamic cards. Here are the placeholder theme frames -->
                
                <div class="nft-card">
                    <div class="card-top">
                        <div class="card-top-left">
                            <img src="https://placehold.co/50" alt="H"> 
                            <span id="hostName">Host</span> <i class="fas fa-check-circle" style="color:#2563eb"></i>
                        </div>
                        <div class="card-lock"><i class="fas fa-lock"></i></div>
                    </div>
                    <div class="card-timer">
                        <div class="timer-pill">12<span>DAYS</span></div>
                        <div class="timer-pill">21<span>HRS</span></div>
                    </div>
                    <div class="card-bottom">
                        <div class="card-price-pill"><i class="fas fa-users"></i> <span id="totalAttendees">0</span></div>
                        <div class="card-lock" style="background: white;"><i class="fas fa-bookmark" style="color: black"></i></div>
                    </div>
                </div>

                <div class="nft-card" style="background: var(--card-yellow)">
                    <div class="card-top">
                        <div class="card-top-left">
                            <span style="font-size: 0.75rem;">Nexus Auto-Sync</span>
                        </div>
                        <div class="card-lock"><i class="fas fa-bolt"></i></div>
                    </div>
                    <div class="card-bottom">
                        <div class="card-price-pill"><i class="fas fa-ticket-alt"></i> <span id="totalTickets">0</span></div>
                    </div>
                </div>

            </div>
        </section>

        <!-- History Table -->
        <section class="nft-history">
            <div class="history-header">
                <div class="nft-section-title" style="margin: 0;">History</div>
                <div class="history-tabs">
                    <span class="active">All history</span>
                    <span>Purchase</span>
                    <span>Transfer</span>
                </div>
            </div>
            
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Event</th>
                        <th>User</th>
                        <th>Tickets</th>
                        <th>Value</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="activityList">
                    <!-- Dynamic injection overrider -->
                    <tr>
                        <td>Ticket Purchase</td>
                        <td class="history-row-users">
                            <img src="https://placehold.co/50"> <i class="fas fa-arrow-right history-arrow"></i>
                        </td>
                        <td>3</td>
                        <td>₹1,240</td>
                        <td style="color: var(--nft-text-muted)">21/08</td>
                    </tr>
                    <tr>
                        <td>Check-In</td>
                        <td class="history-row-users">
                            <img src="https://placehold.co/50"> <i class="fas fa-qrcode" style="color:var(--nft-text-muted)"></i>
                        </td>
                        <td>1</td>
                        <td>-</td>
                        <td style="color: var(--nft-text-muted)">21/08</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- 3. RIGHT FEATURED (Stats Hooked In) -->
    <aside class="nft-featured">
        <div class="featured-top">
            <div class="featured-user">
                <img src="https://placehold.co/50" alt="nx">
                <span style="font-weight: 700; font-size: 0.8rem">TechFest #26</span> <i class="fas fa-check-circle" style="color:#2563eb"></i>
            </div>
            <div class="featured-actions">
                <button class="f-btn"><i class="fas fa-shopping-bag"></i></button>
                <button class="f-btn" onclick="showShareModal()"><i class="fas fa-share"></i></button>
            </div>
        </div>
        
        <!-- Massive image placeholder -->
        <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Fest Art" class="featured-image">

        <div class="featured-info">
            <h2>Annual Fest</h2>
            <h3>#Live Events</h3>
        </div>

        <div class="featured-bottom">
            <div class="f-stat-pill"><i class="fas fa-image" style="color: var(--nft-text-muted)"></i> <span id="totalFests">0</span> Total Fests</div>
            <div class="f-stat-pill dark"><span id="totalRevenue">₹0</span> <i class="fab fa-ethereum"></i></div>
            <button class="f-btn" style="background: white; color: black;"><i class="fas fa-bookmark"></i></button>
        </div>
    </aside>

</div>

<!-- Unchanging original Modals for JS logic compatibility -->
<div class="modal" id="shareModal" style="display: none; position: fixed; z-index: 100;">
    <!-- Simple hidden block to avoid JS errors if clicked -->
</div>

<!-- Toast -->
<div class="toast" id="toast" style="display: none; position: fixed;"></div>

<script src="js/host-dashboard.js"></script>
</body>
</html>
